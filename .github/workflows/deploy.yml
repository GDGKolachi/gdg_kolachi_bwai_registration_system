name: Deploy to GCP Compute Engine

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- Authenticate to GCP ----
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # ---- Write production .env from GitHub secrets ----
      - name: Write production .env
        run: |
          cat > deploy/.env <<EOF
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          APP_URL=${{ secrets.APP_URL }}
          PORT=3000
          EOF

      # ---- Copy .env to VM ----
      - name: Copy .env to VM
        run: |
          gcloud compute scp deploy/.env ${{ secrets.GCP_VM_NAME }}:/opt/gdg-bwai/.env \
            --zone=${{ secrets.GCP_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }}

      # ---- SSH: pull latest code, rebuild, restart ----
      - name: Deploy on VM
        run: |
          gcloud compute ssh ${{ secrets.GCP_VM_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            -- bash <<'REMOTE'
              set -euo pipefail
              APP_DIR="/opt/gdg-bwai"

              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main

              cp -f .env .env

              docker compose up --build -d --remove-orphans

              echo "Waiting for services..."
              sleep 15
              docker compose ps
          REMOTE
