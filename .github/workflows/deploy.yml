name: Deploy to GCP Compute Engine

on:
  push:
    branches:
      - main

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build backend
        working-directory: ./backend
        run: |
          npm ci
          npm run build

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-check

    env:
      VM_NAME: gdg-bwai-vm
      ZONE: us-central1-a
      PROJECT_ID: gdg-registration-492219

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: gdg-registration-492219

      - name: Write .env to VM
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          ENV_CONTENT="DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_NAME=${DB_NAME}
          JWT_SECRET=${JWT_SECRET}
          ADMIN_EMAIL=${ADMIN_EMAIL}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          RESEND_API_KEY=${RESEND_API_KEY}
          FRONTEND_URL=${FRONTEND_URL}
          APP_URL=${APP_URL}
          PORT=3000"

          gcloud compute ssh ${VM_NAME} \
            --zone=${ZONE} \
            --project=${PROJECT_ID} \
            --ssh-key-expire-after=120s \
            --strict-host-key-checking=no \
            --quiet \
            --command="echo '${ENV_CONTENT}' | sudo tee /opt/gdg-bwai/.env > /dev/null && sudo sed -i 's/^[[:space:]]*//' /opt/gdg-bwai/.env && sudo chmod 600 /opt/gdg-bwai/.env"

      - name: Upload code to VM
        run: |
          tar czf /tmp/app.tar.gz --exclude='.git' --exclude='node_modules' --exclude='deploy/backup-sa-key.json' --exclude='deploy/.env' .
          gcloud compute scp /tmp/app.tar.gz ${VM_NAME}:/tmp/app.tar.gz \
            --zone=${ZONE} \
            --project=${PROJECT_ID} \
            --ssh-key-expire-after=120s \
            --strict-host-key-checking=no \
            --quiet

      - name: Deploy on VM
        run: |
          gcloud compute ssh ${VM_NAME} \
            --zone=${ZONE} \
            --project=${PROJECT_ID} \
            --ssh-key-expire-after=120s \
            --quiet \
            --command="sudo mkdir -p /opt/gdg-bwai && cd /opt/gdg-bwai && sudo find . -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} + && sudo tar xzf /tmp/app.tar.gz -C /opt/gdg-bwai && rm -f /tmp/app.tar.gz && sudo docker compose up --build -d --remove-orphans && echo 'Waiting for services...' && sleep 15 && sudo docker compose ps"
