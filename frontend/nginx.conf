# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name register.gdgkolachi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name register.gdgkolachi.com;

    ssl_certificate /etc/letsencrypt/live/register.gdgkolachi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/register.gdgkolachi.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy /api requests to the NestJS backend
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # SPA fallback — all other routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
